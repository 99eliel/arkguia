<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1320" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ArkGuia" />
  <title>ArkGuia — Astraeos</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root{--bg:#08111d;--panel:#101d2d;--panel2:#14243a;--text:#f4f7fb;--muted:#9fb0c5;--accent:#43d17d;--accent2:#57a8ff;--warning:#ffbf47;--danger:#ff6b6b;--line:#223653}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#07101b,#0a1524 55%,#08111d);color:var(--text);min-height:100vh}
    button,input,select{font:inherit}.app{max-width:1050px;margin:auto;padding:18px 14px 96px}.hero{display:flex;gap:14px;align-items:center;margin-bottom:14px}.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#1f7a48,#55d98a);display:grid;place-items:center;font-size:30px;box-shadow:0 10px 30px #0007}.hero h1{margin:0;font-size:27px}.hero p{margin:4px 0 0;color:var(--muted)}
    .summary{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin:16px 0}.card{background:rgba(16,29,45,.92);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 28px #0003}.big{font-size:30px;font-weight:800}.small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.progress{height:10px;background:#07101b;border-radius:999px;overflow:hidden;margin-top:11px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#8af0ad);transition:.25s}
    .tools{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:10px;margin-bottom:12px}.field{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text);outline:none;width:100%}.field:focus{border-color:var(--accent2)}
    .tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 12px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:999px;white-space:nowrap}.tab.active{background:#173a2a;color:#b8ffd0;border-color:#2c8652}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dino{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;position:relative}.dino.done{border-color:#2c8652;background:linear-gradient(145deg,#112d22,#101d2d)}.check{min-width:31px;height:31px;border-radius:10px;border:2px solid #51677f;display:grid;place-items:center;margin-top:2px;color:transparent}.done .check{background:var(--accent);border-color:var(--accent);color:#062314}.dino h3{margin:0 0 5px;font-size:17px}.meta{font-size:13px;color:var(--muted);line-height:1.45}.badge{display:inline-block;font-size:11px;padding:4px 7px;border-radius:999px;background:#0a1422;border:1px solid var(--line);margin:5px 5px 0 0}.doneMark{position:absolute;right:10px;top:10px;color:#76e99f;font-size:12px;font-weight:700}
    .empty{text-align:center;color:var(--muted);padding:45px 10px}.install{position:fixed;right:16px;bottom:18px;border:0;border-radius:16px;background:var(--accent);color:#042312;font-weight:800;padding:13px 16px;box-shadow:0 10px 28px #0008;display:none}
    dialog{width:min(620px,calc(100% - 24px));border:1px solid var(--line);border-radius:22px;background:#0e1b2b;color:var(--text);padding:0;box-shadow:0 24px 70px #000a}dialog::backdrop{background:#0009}.modalHead{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 18px 10px}.modalHead h2{margin:0}.close{background:#162940;border:1px solid var(--line);color:white;border-radius:12px;width:38px;height:38px}.modalBody{padding:0 18px 18px}.info{background:#0a1421;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.info b{display:block;color:#bcd0e7;margin-bottom:4px}.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:#062314;font-weight:800;padding:13px;margin-top:8px}.primary.undo{background:#263a4f;color:#e9f0f8}
    .footer{margin:25px 0;text-align:center;color:#6f8298;font-size:12px}
    @media(max-width:720px){.summary{grid-template-columns:1fr 1fr}.summary .card:first-child{grid-column:1/-1}.tools{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero h1{font-size:23px}}
  </style>
</head>
<body>
<main class="app">
  <header class="hero"><div class="logo">🦖</div><div><h1>ArkGuia — Astraeos</h1><p>Seu checklist de domesticação no ARK: Survival Ascended</p></div></header>
  <section class="summary">
    <div class="card"><div class="small">Progresso geral</div><div class="big"><span id="doneCount">0</span> de <span id="totalCount">0</span></div><div class="progress"><div id="progressBar" class="bar"></div></div><div id="percent" class="meta" style="margin-top:8px">0% concluído</div></div>
    <div class="card"><div class="small">Faltam domar</div><div id="leftCount" class="big">0</div><div class="meta">criaturas</div></div>
    <div class="card"><div class="small">Domadas</div><div id="doneCard" class="big">0</div><div class="meta">criaturas</div></div>
  </section>
  <section class="tools">
    <input id="search" class="field" placeholder="🔎 Buscar criatura..." />
    <select id="method" class="field"><option value="all">Todos os métodos</option><option>KO</option><option>Passivo</option><option>Especial</option><option>Ovo</option><option>Filhote</option></select>
    <select id="status" class="field"><option value="all">Todas</option><option value="todo">Não domadas</option><option value="done">Domadas</option></select>
  </section>
  <nav class="tabs" id="tabs"><button class="tab active" data-cat="all">Todas</button><button class="tab" data-cat="Terrestre">Terrestres</button><button class="tab" data-cat="Voador">Voadores</button><button class="tab" data-cat="Aquático">Aquáticos</button><button class="tab" data-cat="Aberração">Aberração</button><button class="tab" data-cat="Astraeos">Exclusivos</button></nav>
  <section id="list" class="grid"></section>
  <div class="footer">O progresso fica salvo neste aparelho e funciona offline.</div>
</main>
<button id="installBtn" class="install">⬇ Instalar ArkGuia</button>
<dialog id="details"><div class="modalHead"><div><div class="small" id="modalCategory"></div><h2 id="modalName"></h2></div><button class="close" onclick="details.close()">✕</button></div><div class="modalBody"><div class="info"><b>Método de domesticação</b><span id="modalMethod"></span></div><div class="info"><b>Comida / recurso recomendado</b><span id="modalFood"></span></div><div class="info"><b>Como domar</b><span id="modalHow"></span></div><button id="modalToggle" class="primary"></button></div></dialog>
<script>
const creatures = [
['Achatina','Passivo','Sweet Vegetable Cake','Aproxime-se e ofereça Sweet Vegetable Cake passivamente.','Terrestre'],['Acrocanthosaurus','KO','Kibble / carne nobre','Prenda, aplique torpor e alimente após apagar.','Terrestre'],['Allosaurus','KO','Superior Kibble / carne','Isole do bando, derrube com tranquilizantes e alimente.','Terrestre'],['Ankylosaurus','KO','Regular Kibble / vegetais','Derrube com tranquilizantes; use vegetais ou kibble.','Terrestre'],['Araneo','Passivo','Carne estragada','Use repelente de insetos e alimente sem provocar.','Terrestre'],['Archaeopteryx','KO','Chitin','Derrube com cuidado e coloque quitina no inventário.','Terrestre'],['Argentavis','KO','Superior Kibble / carne','Armadilha de portões ajuda muito; derrube e alimente.','Voador'],['Baryonyx','KO','Regular Kibble / peixe','Derrube em terra e alimente com peixe; não use carne comum como prioridade.','Terrestre'],['Basilosaurus','Passivo','Exceptional Kibble / carne','Elimine ou afaste as mantas e alimente o Basilosaurus passivamente.','Aquático'],['Beelzebufo','KO','Regular Kibble / carne','Derrube com tranquilizantes e alimente.','Terrestre'],['Boaratos','KO','Extraordinary Kibble','Derrube e mantenha atenção no torpor, que cai rapidamente. Leve narcótico ou Bio Toxin.','Astraeos'],['Brontosaurus','KO','Exceptional Kibble / vegetais','Use bastante torpor; mantenha distância da cauda.','Terrestre'],['Carbonemys','KO','Regular Kibble / vegetais','Derrube com tranquilizantes e alimente.','Terrestre'],['Carnotaurus','KO','Regular Kibble / carne','Prenda ou use terreno alto, derrube e alimente.','Terrestre'],['Carcharodontosaurus','Especial','Cadáveres grandes','Entregue cadáveres para ganhar confiança; monte e mate criaturas para avançar o tame.','Terrestre'],['Ceratosaurus','Especial','Hemogoblin Cocktail / alimento específico','Use a mecânica de intoxicação com Hemogoblin Cocktail em uma criatura sua e siga a interação de alimentação.','Terrestre'],['Chalicotherium','Passivo','Beer Jar','Coloque cerveja no último slot, aproxime sem agredir e alimente.','Terrestre'],['Daeodon','KO','Superior Kibble / carne','Derrube e leve muita comida: ele consome rapidamente durante o tame.','Terrestre'],['Deinonychus','Ovo','Ovo fertilizado','Roube um ovo do ninho, incube e crie o filhote.','Terrestre'],['Deinosuchus','Passivo','Superior Kibble / carne','Espere abrir a boca e faça a alimentação passiva na janela de interação.','Terrestre'],['Deinotherium','Especial','Comida específica do tame','Domesticação passiva ligada ao líder do grupo; evite iniciar combate e siga a interação do grupo.','Terrestre'],['Dilophosaur','KO','Basic Kibble / carne','Derrube com pouco torpor e alimente.','Terrestre'],['Dimetrodon','KO','Regular Kibble / carne','Derrube e alimente; monitore bem o torpor.','Terrestre'],['Dimorphodon','KO','Raw Mutton / carne','Derrube com cuidado para não matar e alimente.','Voador'],['Diplocaulus','KO','Simple Kibble / carne','Derrube e alimente.','Aquático'],['Diplodocus','Passivo','Regular Kibble / vegetais','Alimente passivamente; ele empurra, mas normalmente não causa dano.','Terrestre'],['Dire Bear','KO','Superior Kibble / mel','Use armadilha e tranquilizantes; evite excesso de dano.','Terrestre'],['Direwolf','KO','Superior Kibble / carne','Isole do bando, derrube e alimente.','Terrestre'],['Dodo','KO','Basic Kibble / berries','Pouquíssimo torpor; derrube e coloque berries.','Terrestre'],['Doedicurus','KO','Regular Kibble / vegetais','Derrube evitando fazê-lo enrolar; alimente com vegetais ou kibble.','Terrestre'],['Dung Beetle','Passivo','Fezes','Coloque fezes no último slot e alimente passivamente.','Terrestre'],['Electrophorus','Passivo','Bio Toxin','Alimente passivamente com Bio Toxin, de preferência com proteção e montaria adequada.','Aquático'],['Equus','Passivo','Rockarrot','Aproxime, alimente, monte e repita a alimentação quando ele tentar derrubá-lo.','Terrestre'],['Gallimimus','KO','Simple Kibble / vegetais','Use armadilha: é veloz e lerGel','Use proteção/repelente e alimente com AnglerGel passivamente.','Aquático'],['Mantis','Passivo','Deathworm Horn','Use Bug Repellant, coloque o chifre no último slot e alimente sem ser atacado.','Terrestre'],['Megalania','KO','Extraordinary Kibble / carne','Derrube e alimente; cuidado com Mega Rabies.','Terrestre'],['Megaloceros','KO','Simple Kibble / vegetais','Derrube e alimente.','Terrestre'],['Megalodon','KO','Superior Kibble / carne','Derrube na água mantendo distância e alimente.','Aquático'],['Megalosaurus','KO','Superior Kibble / carne','Prefira abordar quando estiver menos ativo; derrube e alimente.','Aberração'],['Megatherium','KO','Superior Kibble / vegetais','Derrube e alimente.','Terrestre'],['Mesopithecus','Passivo','Basic Kibble / berries','Agache e alimente passivamente sem assustar.','Terrestre'],['Moschops','Passivo','Pedido variável','Leia o alimento solicitado na interação e entregue no último slot.','Terrestre'],['Mosasaurus','KO','Exceptional Kibble / carne','Prenda em formação submarina se possível; derrube e alimente.','Aquático'],['Oasisaur','Especial','Mecânica própria','Use a mecânica especial do Oasisaur em vez de torpor convencional.','Terrestre'],['Otter','Passivo','Peixe morto','Arraste peixe morto até a lontra e alimente repetidamente.','Aquático'],['Oviraptor','KO','Ovos','Derrube e coloque ovos no inventário para domesticar.','Terrestre'],['Ovis','Passivo','Sweet Vegetable Cake','Coloque o bolo no último slot e alimente uma vez.','Terrestre'],['Pachy','KO','Simple Kibble / vegetais','Derrube e alimente.','Terrestre'],['Pachyrhinosaurus','KO','Regular Kibble / vegetais','Derrube e alimente.','Terrestre'],['Paraceratherium','KO','Superior Kibble / vegetais','Derrube e alimente.','Terrestre'],['Parasaur','KO','Basic Kibble / berries','Derrube e alimente.','Terrestre'],['Pegomastax','Passivo','Mejoberry','Deixe berries no último slot e permita que ele roube até completar o tame.','Terrestre'],['Phiomia','KO','Basic Kibble / berries','Derrube e alimente.','Terrestre'],['Phoenix','Especial','Fogo','Acerte o Phoenix repetidamente com fontes de fogo durante sua condição de aparição até completar o tame.','Voador'],['Plesiosaur','KO','Superior Kibble / carne','Derrube em águas profundas e alimente.','Aquático'],['Procoptodon','KO','Rare Mushroom','Derrube e alimente com Rare Mushroom.','Terrestre'],['Pteranodon','KO','Regular Kibble / carne','Bola facilita muito; derrube e alimente.','Voador'],['Pulmonoscorpius','KO','Regular Kibble / carne estragada','Derrube e alimente com carne estragada ou kibble.','Terrestre'],['Purlovia','KO','Regular Kibble / carne','Revele, derrube e alimente.','Terrestre'],['Pyromane','Especial','Mecânica de fogo/combate','Reduza sua proteção flamejante e siga a sequência própria de montaria/combate para concluir o tame.','Terrestre'],['Quetzal','KO','Exceptional Kibble / carne','Derrube durante o voo usando estratégia de perseguição/armadilha e alimente.','Voador'],['Raptor','KO','Simple Kibble / carne','Bola ajuda; derrube e alimente.','Terrestre'],['Ravager','KO','Superior Kibble / carne','Prenda, derrube e alimente.','Aberração'],['Rex','KO','Exceptional Kibble / carne','Use armadilha ou terreno seguro, derrube e alimente.','Terrestre'],['Rock Drake','Ovo','Ovo fertilizado','Roube ovo do ninho, incube e crie o filhote.','Aberração'],['Rock Elemental','Especial','Extraordinary Kibble / recursos','Use canhão para acertar a cabeça e causar torpor; depois alimente.','Terrestre'],['Sabertooth','KO','Regular Kibble / carne','Derrube e alimente.','Terrestre'],['Sarco','KO','Regular Kibble / carne','Derrube em terra ou margem e alimente.','Terrestre'],['Snow Owl','KO','Superior Kibble / carne','Prenda em armadilha de voo, derrube e alimente.','Voador'],['Spino','KO','Exceptional Kibble / carne','Prenda ou use terreno alto; derrube e alimente.','Terrestre'],['Stegosaurus','KO','Regular Kibble / vegetais','Derrube e alimente.','Terrestre'],['Tapejara','KO','Superior Kibble / carne','Use bola após aproximação cuidadosa, derrube e alimente.','Voador'],['Terror Bird','KO','Regular Kibble / carne','Prenda porque é rápido, derrube e alimente.','Terrestre'],['Therizinosaur','KO','Exceptional Kibble / vegetais','Derrube e leve narcótico em boa quantidade; torpor exige atenção.','Terrestre'],['Thorny Dragon','KO','Regular Kibble / carne','Derrube e alimente.','Terrestre'],['Thylacoleo','KO','Extraordinary Kibble / carne','Retire de árvores com segurança, prenda, derrube e alimente.','Terrestre'],['Triceratops','KO','Simple Kibble / vegetais','Derrube evitando bater na placa frontal e alimente.','Terrestre'],['Tusoteuthis','Passivo','Black Pearls','Deixe-o agarrar uma criatura resistente, aproxime do bico e entregue Black Pearls.','Aquático'],['Velonasaur','KO','Regular Kibble / carne','Aproxime com cobertura para evitar espinhos, derrube e alimente.','Terrestre'],['Vulture','Passivo','Carne estragada','Use Bug Repellant e alimente passivamente com carne estragada.','Voador'],['Woolly Rhino','KO','Superior Kibble / vegetais','Derrube e alimente.','Terrestre'],['Wyvern de Fogo','Ovo','Ovo fertilizado / Wyvern Milk','Roube ovo do ninho, incube e crie o filhote; Wyvern Milk ajuda na criação.','Voador'],['Wyvern de Gelo','Ovo','Ovo fertilizado / Wyvern Milk','Roube ovo do ninho, incube e crie o filhote.','Voador'],['Wyvern de Lightning','Ovo','Ovo fertilizado / Wyvern Milk','Roube ovo do ninho, incube e crie o filhote.','Voador'],['Wyvern de Veneno','Ovo','Ovo fertilizado / Wyvern Milk','Roube ovo do ninho, incube e crie o filhote.','Voador'],['Yutyrannus','KO','Exceptional Kibble / carne','Separe dos Carnos, prenda, derrube e alimente.','Terrestre']
].map((x,i)=>({id:i+1,name:x[0],method:x[1],food:x[2],how:x[3],category:x[4]}));
const KEY='arkguia-astraeos-v1';let done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));let cat='all';
const $=s=>document.querySelector(s);const list=$('#list');
function save(){localStorage.setItem(KEY,JSON.stringify([...done]));updateSummary()}
function updateSummary(){const n=done.size,t=creatures.length,p=t?Math.round(n/t*100):0;$('#doneCount').textContent=n;$('#totalCount').textContent=t;$('#leftCount').textContent=t-n;$('#doneCard').textContent=n;$('#percent').textContent=p+'% concluído';$('#progressBar').style.width=p+'%'}
function filtered(){const q=$('#search').value.trim().toLowerCase(),m=$('#method').value,s=$('#status').value;return creatures.filter(c=>(!q||c.name.toLowerCase().includes(q)||c.food.toLowerCase().includes(q))&&(m==='all'||c.method===m)&&(cat==='all'||c.category===cat)&&(s==='all'||(s==='done'&&done.has(c.id))||(s==='todo'&&!done.has(c.id))))}
function render(){const arr=filtered();list.innerHTML=arr.length?'':`<div class="empty">Nenhuma criatura encontrada com esses filtros.</div>`;arr.forEach(c=>{const el=document.createElement('article');el.className='dino '+(done.has(c.id)?'done':'');el.innerHTML=`<div class="check">✓</div><div><h3>${c.name}</h3><div class="meta">${c.food}</div><span class="badge">${c.method}</span><span class="badge">${c.category}</span></div>${done.has(c.id)?'<span class="doneMark">DOMADA</span>':''}`;el.addEventListener('click',()=>openDetails(c));list.appendChild(el)})}
function openDetails(c){$('#modalCategory').textContent=c.category;$('#modalName').textContent=c.name;$('#modalMethod').textContent=c.method;$('#modalFood').textContent=c.food;$('#modalHow').textContent=c.how;const b=$('#modalToggle');const sync=()=>{b.textContent=done.has(c.id)?'↩ Marcar como não domada':'✓ Marcar como domada';b.className='primary'+(done.has(c.id)?' undo':'')};sync();b.onclick=()=>{done.has(c.id)?done.delete(c.id):done.add(c.id);save();render();sync()};$('#details').showModal()}
$('#search').addEventListener('input',render);$('#method').addEventListener('change',render);$('#status').addEventListener('change',render);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render()});
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').style.display='block'});$('#installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#installBtn').style.display='none'};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
updateSummary();render();
</script>
</body></html>
