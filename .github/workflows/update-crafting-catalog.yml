name: Atualizar catálogo de criação

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-crafting-catalog.yml'
      - 'scripts/update_crafting_catalog.py'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Gerar catálogo completo do ASA
        run: python3 scripts/update_crafting_catalog.py
      - name: Salvar catálogo quando houver mudança
        run: |
          if git diff --quiet -- crafting-catalog.json crafting-data.js; then
            echo "Catálogo já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crafting-catalog.json crafting-data.js
          git commit -m "Update full ASA crafting catalog"
          git push
